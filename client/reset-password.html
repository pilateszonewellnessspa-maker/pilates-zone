<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password – Pilates Zone Wellness Spa</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { gold:'#B8962E', cream:'#F5F0E8', 'warm-gray':'#C5BEB0', charcoal:'#3A3530' },
          fontFamily: { display:['Cormorant Garamond','serif'], body:['Jost','sans-serif'] },
        }
      }
    }
  </script>
  <style>
    :root { --gold:#B8962E; --cream:#F5F0E8; --charcoal:#3A3530; }
    body { background:var(--cream); color:var(--charcoal); font-family:'Jost',sans-serif; }
    .section-label { font-size:.7rem; letter-spacing:.2em; text-transform:uppercase; color:var(--gold); font-weight:500; }
    .gold-line { width:48px; height:2px; background:var(--gold); }
    .btn-gold { background:var(--gold); color:#fff; font-family:'Jost',sans-serif; font-weight:500; letter-spacing:.08em; text-transform:uppercase; font-size:.78rem; padding:12px 28px; border-radius:2px; transition:background .3s,transform .2s; cursor:pointer; border:none; }
    .btn-gold:hover { background:#9a7c22; transform:translateY(-2px); }
    .btn-gold:disabled { opacity:.6; cursor:not-allowed; transform:none; }
    .form-input { width:100%; background:rgba(255,255,255,.8); border:1px solid rgba(184,150,46,.3); border-radius:3px; padding:10px 14px; font-family:'Jost',sans-serif; font-size:.9rem; color:var(--charcoal); outline:none; transition:border-color .2s; }
    .form-input:focus { border-color:var(--gold); box-shadow:0 0 0 3px rgba(184,150,46,.12); }
    .alert-error   { background:#fef2f2; border:1px solid #fecaca; color:#991b1b; padding:10px 14px; border-radius:3px; font-size:.82rem; display:none; margin-bottom:14px; }
    .alert-success { background:#f0fdf4; border:1px solid #bbf7d0; color:#166534; padding:10px 14px; border-radius:3px; font-size:.82rem; display:none; margin-bottom:14px; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <nav style="background:rgba(245,240,232,.96);backdrop-filter:blur(8px);border-bottom:1px solid rgba(184,150,46,.15);" class="sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
      <span class="flex items-center gap-3">
        <img src="logo.png" alt="Pilates Zone Logo" style="width:36px;height:36px;object-fit:contain;" />
        <span class="font-display text-xl tracking-wide" style="color:var(--gold)">Pilates Zone</span>
      </span>
      <a href="login.html" class="section-label hover:opacity-70 transition-opacity">Sign In →</a>
    </div>
  </nav>

  <main class="flex-1 flex items-center justify-center px-6 py-16">
    <div class="w-full max-w-md">

      <div class="text-center mb-10">
        <div class="flex items-center justify-center gap-3 mb-4">
          <div class="gold-line"></div><span class="section-label">Secure Reset</span><div class="gold-line"></div>
        </div>
        <h1 class="font-display text-3xl md:text-4xl font-light">Set New <em class="not-italic" style="color:var(--gold)">Password</em></h1>
        <p class="font-body text-sm mt-3" style="color:rgba(58,53,48,.6)">Choose a strong password for your account.</p>
      </div>

      <!-- Invalid token message -->
      <div id="invalidToken" class="hidden bg-white/70 backdrop-blur-sm rounded p-8 text-center border border-gold/10">
        <p class="font-display text-2xl font-light mb-2">Link Expired</p>
        <p class="font-body text-sm mb-6" style="color:rgba(58,53,48,.6)">This reset link is invalid or has expired.</p>
        <a href="forgot-password.html" class="btn-gold inline-block">Request a New Link</a>
      </div>

      <div id="formWrapper" class="bg-white/70 backdrop-blur-sm rounded p-8 shadow-sm border border-gold/10">
        <div id="errEl" class="alert-error"></div>
        <div id="sucEl" class="alert-success"></div>

        <form id="frm" class="space-y-5" novalidate>
          <div>
            <label class="font-body text-[.65rem] uppercase tracking-widest block mb-2" style="color:rgba(58,53,48,.5)">New Password</label>
            <div class="relative">
              <input id="newPass" type="password" class="form-input" placeholder="Min. 6 characters" required />
              <button type="button" onclick="toggle('newPass',this)" class="absolute right-3 top-1/2 -translate-y-1/2 text-charcoal/40 text-xs uppercase tracking-widest hover:text-gold transition-colors">Show</button>
            </div>
          </div>
          <div>
            <label class="font-body text-[.65rem] uppercase tracking-widest block mb-2" style="color:rgba(58,53,48,.5)">Confirm Password</label>
            <div class="relative">
              <input id="confPass" type="password" class="form-input" placeholder="Repeat new password" required />
              <button type="button" onclick="toggle('confPass',this)" class="absolute right-3 top-1/2 -translate-y-1/2 text-charcoal/40 text-xs uppercase tracking-widest hover:text-gold transition-colors">Show</button>
            </div>
          </div>
          <button type="submit" id="submitBtn" class="btn-gold w-full">Reset Password</button>
        </form>
      </div>

    </div>
  </main>

  <footer class="py-8 px-6 text-center">
    <p class="font-body text-[.65rem] tracking-wide" style="color:#5A534E">© 2025 Pilates Zone Wellness Spa. All rights reserved.</p>
  </footer>

  <script>
    const API   = '/api';
    const token = new URLSearchParams(window.location.search).get('token');

    if (!token) {
      document.getElementById('formWrapper').classList.add('hidden');
      document.getElementById('invalidToken').classList.remove('hidden');
    }

    function toggle(id, btn) {
      const inp = document.getElementById(id);
      const show = inp.type === 'password';
      inp.type = show ? 'text' : 'password';
      btn.textContent = show ? 'Hide' : 'Show';
    }

    document.getElementById('frm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl = document.getElementById('errEl');
      const sucEl = document.getElementById('sucEl');
      const btn   = document.getElementById('submitBtn');
      errEl.style.display = 'none';
      sucEl.style.display = 'none';

      const newPass  = document.getElementById('newPass').value;
      const confPass = document.getElementById('confPass').value;

      if (newPass.length < 6) { errEl.textContent = 'Password must be at least 6 characters.'; errEl.style.display = 'block'; return; }
      if (newPass !== confPass) { errEl.textContent = 'Passwords do not match.'; errEl.style.display = 'block'; return; }

      btn.disabled = true; btn.textContent = 'Resetting…';

      try {
        const res  = await fetch(`${API}/auth/reset-password`, {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ token, password: newPass }),
        });
        const data = await res.json();

        if (data.success) {
          sucEl.textContent = data.message + ' Redirecting to login…';
          sucEl.style.display = 'block';
          document.getElementById('frm').classList.add('hidden');
          setTimeout(() => { window.location.href = 'login.html'; }, 2500);
        } else {
          if (data.message.includes('Invalid') || data.message.includes('expired')) {
            document.getElementById('formWrapper').classList.add('hidden');
            document.getElementById('invalidToken').classList.remove('hidden');
          } else {
            errEl.textContent = data.message;
            errEl.style.display = 'block';
            btn.disabled = false; btn.textContent = 'Reset Password';
          }
        }
      } catch {
        errEl.textContent = 'Could not connect to server. Please try again.';
        errEl.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Reset Password';
      }
    });
  </script>
</body>
</html>
