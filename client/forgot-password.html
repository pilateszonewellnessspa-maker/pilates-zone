<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password – Pilates Zone Wellness Spa</title>
  <meta name="description" content="Reset your Pilates Zone account password." />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gold: '#B8962E', 'gold-light': '#D4AF5A',
            cream: '#F5F0E8', 'cream-dark': '#EDE6D9', 'warm-gray': '#C5BEB0', charcoal: '#3A3530',
          },
          fontFamily: { display: ['Cormorant Garamond', 'serif'], body: ['Jost', 'sans-serif'] },
        }
      }
    }
  </script>
  <style>
    :root { --gold:#B8962E; --cream:#F5F0E8; --cream-dark:#EDE6D9; --charcoal:#3A3530; }
    body { background-color:var(--cream); color:var(--charcoal); font-family:'Jost',sans-serif; }
    .section-label { font-size:.7rem; letter-spacing:.2em; text-transform:uppercase; color:var(--gold); font-weight:500; }
    .gold-line { width:48px; height:2px; background:var(--gold); }
    .btn-gold { background:var(--gold); color:#fff; font-family:'Jost',sans-serif; font-weight:500; letter-spacing:.08em; text-transform:uppercase; font-size:.78rem; padding:12px 28px; border-radius:2px; transition:background .3s,transform .2s; cursor:pointer; border:none; }
    .btn-gold:hover { background:#9a7c22; transform:translateY(-2px); }
    .btn-gold:disabled { opacity:.6; cursor:not-allowed; transform:none; }
    .form-input { width:100%; background:rgba(255,255,255,.8); border:1px solid rgba(184,150,46,.3); border-radius:3px; padding:10px 14px; font-family:'Jost',sans-serif; font-size:.9rem; color:var(--charcoal); outline:none; transition:border-color .2s,box-shadow .2s; }
    .form-input:focus { border-color:var(--gold); box-shadow:0 0 0 3px rgba(184,150,46,.12); }
    .alert-error { background:#fef2f2; border:1px solid #fecaca; color:#991b1b; padding:10px 14px; border-radius:3px; font-size:.82rem; display:none; margin-bottom:14px; }
    .alert-success { background:#f0fdf4; border:1px solid #bbf7d0; color:#166534; padding:10px 14px; border-radius:3px; font-size:.82rem; display:none; margin-bottom:14px; }
    .wave-bg { position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:0; }
    .wave-bg::before { content:''; position:absolute; inset:0; background:radial-gradient(ellipse 80% 60% at 50% 0%, rgba(184,150,46,.06) 0%, transparent 70%); }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Nav -->
  <nav style="background:rgba(245,240,232,.96);backdrop-filter:blur(8px);border-bottom:1px solid rgba(184,150,46,.15);" class="sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
      <a href="login.html" class="flex items-center gap-3">
        <img src="logo.png" alt="Pilates Zone Logo" style="width:36px;height:36px;object-fit:contain;" />
        <span class="font-display text-xl tracking-wide" style="color:var(--gold)">Pilates Zone</span>
      </a>
      <a href="login.html" class="section-label hover:opacity-70 transition-opacity">← Back to Login</a>
    </div>
  </nav>

  <main class="flex-1 flex items-center justify-center px-6 py-16 relative">
    <div class="wave-bg"></div>
    <div class="relative z-10 w-full max-w-md">

      <div class="text-center mb-10">
        <div class="flex items-center justify-center gap-3 mb-4">
          <div class="gold-line"></div>
          <span class="section-label">Account Recovery</span>
          <div class="gold-line"></div>
        </div>
        <h1 class="font-display text-3xl md:text-4xl font-light" style="color:var(--charcoal)">Forgot <em class="not-italic" style="color:var(--gold)">Password</em></h1>
        <p class="font-body text-sm mt-3" style="color:rgba(58,53,48,.6)">Enter your email and we'll send you a reset link.</p>
      </div>

      <div class="bg-white/70 backdrop-blur-sm rounded p-8 shadow-sm border border-gold/10">
        <div id="errEl" class="alert-error"></div>
        <div id="sucEl" class="alert-success"></div>

        <form id="frm" class="space-y-5" novalidate>
          <div>
            <label class="font-body text-[.65rem] uppercase tracking-widest block mb-2" style="color:rgba(58,53,48,.5)">Email Address</label>
            <input id="emailInp" type="email" class="form-input" placeholder="your@email.com" required />
          </div>
          <button type="submit" id="submitBtn" class="btn-gold w-full">Send Reset Link</button>
        </form>

        <p class="text-center font-body text-xs mt-6" style="color:rgba(58,53,48,.5)">
          Remembered it? <a href="login.html" class="text-gold hover:underline ml-1">Sign in →</a>
        </p>
      </div>

    </div>
  </main>

  <footer class="py-8 px-6 text-center">
    <p class="font-body text-[.65rem] tracking-wide" style="color:#5A534E">© 2025 Pilates Zone Wellness Spa. All rights reserved.</p>
  </footer>

  <script>
    const API = '/api';

    document.getElementById('frm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl = document.getElementById('errEl');
      const sucEl = document.getElementById('sucEl');
      const btn   = document.getElementById('submitBtn');
      errEl.style.display = 'none';
      sucEl.style.display = 'none';

      const email = document.getElementById('emailInp').value.trim();
      if (!email) { errEl.textContent = 'Please enter your email.'; errEl.style.display = 'block'; return; }

      btn.disabled = true; btn.textContent = 'Sending…';

      try {
        const res  = await fetch(`${API}/auth/forgot-password`, {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ email }),
        });
        const data = await res.json();

        if (data.success) {
          sucEl.textContent = data.message;
          sucEl.style.display = 'block';
          document.getElementById('frm').reset();
        } else {
          errEl.textContent = data.message || 'Something went wrong.';
          errEl.style.display = 'block';
        }
      } catch {
        errEl.textContent = 'Could not connect to server. Please try again.';
        errEl.style.display = 'block';
      }

      btn.disabled = false; btn.textContent = 'Send Reset Link';
    });
  </script>
</body>
</html>
